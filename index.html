// --- UI更新ロジック ---
function updateUI() {
    const s = states[state];
    document.getElementById('instruction').innerText = s.text;
    
    // 指カバーのクリア
    document.querySelectorAll('.finger-cover').forEach(el => el.remove());

    // ヒントと選択状態のクリア
    document.querySelectorAll('.hint-glow').forEach(el => el.classList.remove('hint-glow'));
    document.querySelectorAll('.selected').forEach(el => el.classList.remove('selected'));
    document.querySelectorAll('.selected-group-left').forEach(el => el.classList.remove('selected-group-left'));
    document.querySelectorAll('.selected-group-mid').forEach(el => el.classList.remove('selected-group-mid'));
    document.querySelectorAll('.selected-group-right').forEach(el => el.classList.remove('selected-group-right'));
    selectedCells = [];
    
    // ガイド矢印のクリア
    document.querySelectorAll('.guide-arrow').forEach(el => el.remove());

    // テンキー表示切替
    const numpad = document.getElementById('numpad');
    if (s.type === 'input' || s.type === 'ketasu') {
        numpad.classList.add('visible');
    } else {
        numpad.classList.remove('visible');
    }

    // ===== 商のけた数：答えの箱を出しなおす（はんていは numpad ハンドラで行う）=====
    if (mode === 'ketasu') {
        renderKetasuAnswers();
        return;
    }

    // ===== 横式（何十÷何十）専用の描画。ここで完結して return =====
    if (mode === 'yokoshiki') {
        const rem = dividend - q * divisor;
        if (s.type === 'input') {
            const el = document.getElementById(`cell-${s.targetCell}`);
            if (!el.querySelector('.box-input')) el.innerHTML = '<div class="box-input"></div>';
        }
        if (state === 2) {
            // 「たしかめ」後：まずたしかめのかけ算。あまりがあれば続けてひき算の筆算。
            renderYokoMult(() => {
                if (rem === 0) { state = 3; updateUI(); }
                else { renderYokoSub(() => { state = 3; updateUI(); }); }
            });
        }
        if (s.type === 'finish') {
            // あまりがあるときは、式の横に「… あまり」を自動で書く
            if (rem > 0) {
                const L = yokoLay;
                const dotCell = document.getElementById(`cell-r1-c${L.quotientCol + 1}`);
                dotCell.innerText = '…';
                dotCell.classList.add('yoko-dots');
                dotCell.classList.remove('fade-in'); void dotCell.offsetWidth; dotCell.classList.add('fade-in');
                String(rem).split('').forEach((ch, i) => {
                    const el = document.getElementById(`cell-r1-c${L.quotientCol + 2 + i}`);
                    el.innerText = ch;
                    el.classList.remove('fade-in'); void el.offsetWidth; el.classList.add('fade-in');
                });
            }
            document.getElementById('instruction').innerText = answerText();
            if (!document.getElementById('hanamaru').classList.contains('show')) {
                showClearEffect();
            }
        }
        return;
    }

    // ===== けん算：▢を出しなおして、入力中のところを光らせる =====
    if (mode === 'kenzan') {
        document.querySelectorAll('.wide-box').forEach(e => e.remove());
        kenLay.blanks.forEach(bl => {
            if (state >= bl.to) return;                       // 入力ずみ
            const first = document.getElementById(`cell-r3-c${bl.cols[0]}`);
            const box = document.createElement('span');
            box.className = 'wide-box' + ((state >= bl.from) ? ' active' : '');
            box.style.width = `calc(${bl.cols.length * 100}% - 8px)`;
            first.appendChild(box);
        });
        if (s.type === 'finish' && !document.getElementById('hanamaru').classList.contains('show')) {
            showClearEffect();
        }
        return;
    }

    // ===== 商の見当：文をうめていく。数を入れたらかけ算をして、積を書きかえる =====
    if (mode === 'kentou') {
        const L = kentouLay;
        if (state === 1) {
            // ★大きすぎた積はまだ消さない。商のところだけ立てなおしの箱にする
            document.getElementById('cell-' + L.qCell).innerHTML =
                '<div class="box-input"><span class="ghost-num">' + L.est + '</span></div>';
        }
        document.getElementById('instruction').innerHTML = kentouSentence();
        if (s.type === 'finish' && !kentouBusy &&
            !document.getElementById('hanamaru').classList.contains('show')) {
            // わる数 × なおした商 のかけ算を右に順に出し、その積を筆算におろす
            // （このとき、はじめに書いてあった大きすぎる積が書きかわる）
            kentouBusy = true;
            renderMultBox(L.right, L.right * divisor, showClearEffect, 2, L.onesCol, 0);
        }
        return;
    }

    // ===== くふう：▢を出しなおして、入力中のところを光らせる =====
    if (mode === 'kufu') {
        document.querySelectorAll('.wide-box').forEach(e => e.remove());
        kufuLay.blanks.forEach(bl => {
            if (state >= bl.to) return;                       // 入力ずみ
            const first = document.getElementById(`cell-r${bl.row}-c${bl.cols[0]}`);
            const box = document.createElement('span');
            box.className = 'wide-box' + ((state >= bl.from) ? ' active' : '');
            box.style.width = `calc(${bl.cols.length * 100}% - 8px)`;
            first.appendChild(box);
        });
        if (s.type === 'finish' && !document.getElementById('hanamaru').classList.contains('show')) {
            showClearEffect();
        }
        return;
    }

    // ===== 仮の商：入力箱を出すだけ。はんていは kariTry() が行う =====
    if (mode === 'karishou') {
        if (s.type === 'input') {
            const el = document.getElementById('cell-' + kariLay.qCell);
            if (!el.querySelector('.box-input')) el.innerHTML = '<div class="box-input"></div>';
        }
        if (s.type === 'finish') {
            if (!document.getElementById('hanamaru').classList.contains('show')) {
                showClearEffect();
            }
        }
        return;
    }

    // ステートごとの描画更新
    if (state === 1) {
        if (mode === '2digit_div' || mode === '2digit_div2' || mode === '2digit_div3') {
            document.getElementById('cell-r0-c2').innerHTML = '<span class="red-text">A</span>';
            document.getElementById('cell-r0-c3').innerHTML = '<span class="red-text">B</span>';
        } else if (mode === '2digit') {
            document.getElementById('cell-r0-c3').innerHTML = '<span class="red-text">A</span>';
            document.getElementById('cell-r0-c4').innerHTML = '<span class="red-text">B</span>';
        } else if (mode === '3digit_div1') {
            document.getElementById('cell-r0-c2').innerHTML = '<span class="red-text">A</span>';
            document.getElementById('cell-r0-c3').innerHTML = '<span class="red-text">B</span>';
            document.getElementById('cell-r0-c4').innerHTML = '<span class="red-text">C</span>';
        } else if (mode === '3digit_div2') {
            // 筆算５：商は十の位(B)から立つ
            document.getElementById('cell-r0-c2').innerHTML = '<span class="red-text">A</span>';
            document.getElementById('cell-r0-c3').innerHTML = '<span class="red-text">B</span>';
            document.getElementById('cell-r0-c4').innerHTML = '<span class="red-text">C</span>';
        } else if (mode === '3digit_div3') {
            // 筆算６：わられる数3けた。商は一の位(C)に立つ
            document.getElementById('cell-r0-c3').innerHTML = '<span class="red-text">A</span>';
            document.getElementById('cell-r0-c4').innerHTML = '<span class="red-text">B</span>';
            document.getElementById('cell-r0-c5').innerHTML = '<span class="red-text">C</span>';
        } else {
            document.getElementById('cell-r0-c3').innerHTML = '<span class="red-text">A</span>';
            document.getElementById('cell-r0-c4').innerHTML = '<span class="red-text">B</span>';
            document.getElementById('cell-r0-c5').innerHTML = '<span class="red-text">C</span>';
        }
    }
    if (state === 2) {
        if (mode === '2digit') {
            document.getElementById('cell-r0-c3').innerHTML = '<div class="box-input"></div>';
            document.getElementById('cell-r0-c4').innerHTML = ''; // Bを消す
        } else if (mode === '3digit1') {
            document.getElementById('cell-r0-c3').innerHTML = '<div class="box-input"></div>';
            document.getElementById('cell-r0-c4').innerHTML = ''; 
            document.getElementById('cell-r0-c5').innerHTML = ''; 
        } else if (mode === '3digit2') {
            document.getElementById('cell-r0-c3').innerHTML = ''; 
            document.getElementById('cell-r0-c4').innerHTML = '<div class="box-input"></div>';
            document.getElementById('cell-r0-c5').innerHTML = ''; 
        } else if (mode === '2digit_div' || mode === '2digit_div2' || mode === '2digit_div3') {
            document.getElementById('cell-r0-c2').innerHTML = ''; // Aを消す
            document.getElementById('cell-r0-c3').innerHTML = '<div class="box-input"></div>';
            // 指でかくす：わる数の一の位(c1)とわられる数の一の位(c3)を隠す
            addFingerCover('r1-c1');
            addFingerCover('r1-c3');
        } else if (mode === '3digit_div1') {
            document.getElementById('cell-r0-c2').innerHTML = ''; // Aを消す
            document.getElementById('cell-r0-c3').innerHTML = ''; // Bを消す
            document.getElementById('cell-r0-c4').innerHTML = '<div class="box-input"></div>';
            // 指でかくす：わる数の一の位(c1)とわられる数の一の位(c4)を隠す
            addFingerCover('r1-c1');
            addFingerCover('r1-c4');
        } else if (mode === '3digit_div2') {
            // 筆算５：十の位(c3)に箱。A/B/Cを消す
            document.getElementById('cell-r0-c2').innerHTML = '';
            document.getElementById('cell-r0-c3').innerHTML = '<div class="box-input"></div>';
            document.getElementById('cell-r0-c4').innerHTML = '';
            // 指でかくす：わる数の一の位(c1)と、まだ使わないわられる数の十の位(c3)・一の位(c4)
            addFingerCover('r1-c1');
            addFingerCover('r1-c3');
            addFingerCover('r1-c4');
        } else if (mode === '3digit_div3') {
            // 筆算６：一の位(c5)に箱。A/B/Cを消す。指かくし：わる数と わられる数の 十の位・一の位を隠す
            document.getElementById('cell-r0-c3').innerHTML = '';
            document.getElementById('cell-r0-c4').innerHTML = '';
            document.getElementById('cell-r0-c5').innerHTML = '<div class="box-input"></div>';
            addFingerCover('r1-c1'); addFingerCover('r1-c2');
            addFingerCover('r1-c4'); addFingerCover('r1-c5');
        }
    }
    if (state === 5 && mode !== '3digit_div2' && mode !== '3digit_div3') { // かけ算1完了
        if (mode === '2digit_div') {
            // あいたスペースに かけ算の筆算を順番に表示し、最後にわり算へ積をおろす
            renderMultBox();
        } else if (mode === '2digit_div2') {
            // 大きすぎる商(qBig)でかけ算 → 積(sub1Big)をわられる数の下へ → ✗ → やりなおしへ
            renderMultBox(qBig, sub1Big, () => {
                showWrongX();
                setTimeout(() => { state = 6; updateUI(); }, 1600);
            });
        } else if (mode === '2digit_div3') {
            // 見当(qBig1)でかけ算 → 積(sub1Big1)をわられる数の下へ → ✗ → 1回目のやりなおしへ
            renderMultBox(qBig1, sub1Big1, () => {
                showWrongX();
                setTimeout(() => { state = 6; updateUI(); }, 1600);
            });
        } else if (mode === '3digit_div1') {
            // 筆算４：見当(qBig)でかけ算(3けたの積) → わられる数の下へ → ✗ → やりなおしへ
            renderMult3(qBig, sub1Big, () => {
                showWrongX4();
                setTimeout(() => { state = 6; updateUI(); }, 1600);
            });
        } else if (mode === '3digit1') {
            document.getElementById('cell-r2-c3').innerText = sub1;
            document.getElementById('cell-r2-c3').classList.remove('border-hidden');
        } else if (mode === '3digit2') {
            const prod = sub1;
            document.getElementById('cell-r2-c3').innerText = Math.floor(prod / 10) || '';
            document.getElementById('cell-r2-c4').innerText = prod % 10;
            document.getElementById('cell-r2-c3').classList.remove('border-hidden');
            document.getElementById('cell-r2-c4').classList.remove('border-hidden');
        } else {
        // sub1 = q1 * divisor。十の位の積なので、c1を起点に右詰めで表示。
        // 1桁(8)の場合 → c1に"8"
        // (sub1は被除数の十の位以下なので必ず1桁になるはず)
        if (sub1 >= 10) {
            document.getElementById('cell-r2-c2').innerText = Math.floor(sub1 / 10);
            document.getElementById('cell-r2-c3').innerText = sub1 % 10;
            document.getElementById('cell-r2-c2').classList.remove('border-hidden');
            document.getElementById('cell-r2-c3').classList.remove('border-hidden');
        } else {
            document.getElementById('cell-r2-c3').innerText = sub1;
            document.getElementById('cell-r2-c3').classList.remove('border-hidden');
        }
        }
    }
    // --- 筆算２ 専用の描画 ---
    if (state === 6 && mode === '2digit_div2') {
        // やりなおし：✗・大きすぎた商・大きすぎた積・かけ算の筆算を消す
        clearWrongX();
        clearMultBox();
        ['r2-c1', 'r2-c2', 'r2-c3'].forEach(id => {
            const el = document.getElementById('cell-' + id);
            el.innerText = '';
            el.classList.add('border-hidden');
            if (id === 'r2-c1') el.classList.remove('border-bottom');
        });
        // 立てるところに箱＋うっすら最初に立てた商(qBig)
        document.getElementById('cell-r0-c3').innerHTML =
            '<div class="box-input"><span class="ghost-num">' + qBig + '</span></div>';
    }
    if (state === 9 && mode === '2digit_div2') {
        // 正しい商(q)でかけ算の筆算 → わり算へ積(sub1)をおろす
        renderMultBox(q, sub1);
    }
    // --- 筆算３ 専用の描画（立てなおし2回） ---
    if (state === 6 && mode === '2digit_div3') {
        // 1回目のやりなおし：✗・見当の商・積・かけ算の筆算を消す → 箱＋うっすら見当(qBig1)
        clearWrongX();
        clearMultBox();
        ['r2-c2', 'r2-c3'].forEach(id => {
            const el = document.getElementById('cell-' + id);
            el.innerText = '';
            el.classList.add('border-hidden');
        });
        document.getElementById('cell-r0-c3').innerHTML =
            '<div class="box-input"><span class="ghost-num">' + qBig1 + '</span></div>';
    }
    if (state === 9 && mode === '2digit_div3') {
        // 修正1の商(qBig2)でかけ算 → 積(sub1Big2)をわられる数の下へ → ✗ → 2回目のやりなおしへ
        renderMultBox(qBig2, sub1Big2, () => {
            showWrongX();
            setTimeout(() => { state = 10; updateUI(); }, 1600);
        });
    }
    if (state === 10 && mode === '2digit_div3') {
        // 2回目のやりなおし：✗・積・かけ算の筆算を消す → 箱＋うっすら修正1(qBig2)
        clearWrongX();
        clearMultBox();
        ['r2-c2', 'r2-c3'].forEach(id => {
            const el = document.getElementById('cell-' + id);
            el.innerText = '';
            el.classList.add('border-hidden');
        });
        document.getElementById('cell-r0-c3').innerHTML =
            '<div class="box-input"><span class="ghost-num">' + qBig2 + '</span></div>';
    }
    if (state === 13 && mode === '2digit_div3') {
        // 正しい商(q)でかけ算の筆算 → わり算へ積(sub1)をおろす
        renderMultBox(q, sub1);
    }
    if (state === 15 && mode === '2digit_div3') {
        // あまりを表示（r3-c2,c3）
        const rem = dividend - sub1;
        if (rem >= 10) {
            document.getElementById('cell-r3-c2').innerText = Math.floor(rem / 10);
            document.getElementById('cell-r3-c3').innerText = rem % 10;
        } else if (rem > 0) {
            document.getElementById('cell-r3-c3').innerText = rem;
        }
    }
    // --- 筆算４ 専用の描画（3けた÷2けた・1回修正） ---
    if (state === 6 && mode === '3digit_div1') {
        // やりなおし：✗・見当の商・積(3けた)・かけ算の筆算を消す → 箱＋うっすら見当(qBig)
        clearWrongX4();
        clearMultBox();
        ['r2-c2', 'r2-c3', 'r2-c4'].forEach(id => {
            const el = document.getElementById('cell-' + id);
            el.innerText = '';
            el.classList.add('border-hidden');
        });
        document.getElementById('cell-r0-c4').innerHTML =
            '<div class="box-input"><span class="ghost-num">' + qBig + '</span></div>';
    }
    if (state === 9 && mode === '3digit_div1') {
        // 正しい商(q)でかけ算の筆算(3けたの積) → わり算へ積(sub1)をおろす
        renderMult3(q, sub1);
    }
    if (state === 11 && mode === '3digit_div1') {
        // あまりを表示（わられる数3けた − 積、右づめで c3,c4 または c4）
        const rem = dividend - sub1;
        if (rem >= 10) {
            document.getElementById('cell-r3-c3').innerText = Math.floor(rem / 10);
            document.getElementById('cell-r3-c4').innerText = rem % 10;
        } else if (rem > 0) {
            document.getElementById('cell-r3-c4').innerText = rem;
        }
    }
    // ===== 筆算６ 専用の描画（3けた÷3けた・商1けた・見当✗→立てなおし） =====
    if (state === 5 && mode === '3digit_div3') {
        // 見当(qBig)でかけ算の筆算（右）→ 積(3けた)をわられる数の下に → ✗(c6) → 立てなおしへ
        renderMultBox6(qBig, sub1Big, () => {
            showWrongXAt(2, 6);
            setTimeout(() => { state = 6; updateUI(); }, 1600);
        });
    }
    if (state === 6 && mode === '3digit_div3') {
        // 立てなおし：✗・大きすぎた積(c3,c4,c5)・かけ算の筆算を消す → 箱＋うっすら見当(qBig)
        clearMultBox6();
        ['r2-c3', 'r2-c4', 'r2-c5'].forEach(id => {
            const el = document.getElementById('cell-' + id);
            el.innerText = ''; el.classList.add('border-hidden');

        document.getElementById('cell-r0-c5').innerHTML =
            '<div class="box-input"><span class="ghost-num">' + qBig + '</span></div>';

    if (state === 9 && mode === '3digit_div3') {
        // 正しい商(q)でかけ算の筆算（右）→ 積(3けた)をわられる数の下に＋ひき算の線
        renderMultBox6(q, sub1);
    }
    if (state === 11 && mode === '3digit_div3') {
        // あまり（わられる数3けた − 積）を右づめで r3 に
        const rem = dividend - sub1;
        if (rem >= 100) {
            document.getElementById('cell-r3-c3').innerText = Math.floor(rem / 100);
            document.getElementById('cell-r3-c4').innerText = Math.floor(rem / 10) % 10;
            document.getElementById('cell-r3-c5').innerText = rem % 10;
        } else if (rem >= 10) {
            document.getElementById('cell-r3-c4').innerText = Math.floor(rem / 10);
            document.getElementById('cell-r3-c5').innerText = rem % 10;
        } else if (rem > 0) {
            document.getElementById('cell-r3-c5').innerText = rem;
        }
    }
    if (state === 5 && mode === '3digit_div2') {
        // 見当(est1)でかけ算の筆算（右）→ 積を上2けたの下におろす（右づめ, c3基準）→ ✗ → 立てなおしへ
        renderMultBox(est1, est1 * divisor, () => {
            showWrongXAt(2, 4);
            setTimeout(() => { state = 6; updateUI(); }, 1600);
        }, 2, 3);
    }
    if (state === 6 && mode === '3digit_div2') {
        // 立てなおし：✗・大きすぎた積・かけ算の筆算を消す → 箱＋うっすら見当(est1)

        h5clearProduct(3, 2, 4);

    if (state === 9 && mode === '3digit_div2') {

        renderMultBox(q1, sub1, null, 2, 3);

    if (state === 11 && mode === '3digit_div2') {
        // ひき算1のあと、差1（1けた）を c3 に
        const diff1 = Math.floor(dividend / 10) - sub1;
        document.getElementById('cell-r3-c3').innerText = diff1;
    }
    if (state === 12 && mode === '3digit_div2') {

        const numToDrop = dividend % 10;
        document.getElementById('cell-r1-c4').innerHTML =
            `<span class="draggable-span" id="drag-target-span">${numToDrop}</span>`;
        initDragDrop('drag-target-span', 'cell-r3-c4');
    }
    if (state === 13 && mode === '3digit_div2') {
        // おろした数を確定
        const numToDrop = dividend % 10;
        document.getElementById('cell-r1-c4').innerText = numToDrop;
        document.getElementById('cell-r3-c4').innerText = numToDrop;
    }
    // --- 2サイクル目（一の位）---
    if (state === 14 && mode === '3digit_div2') {
        // 一の位(c4)に箱＋指かくし（わる数の一の位と、おろしてできた数の一の位）
        // ★十の位のかけ算の筆算（右）はそのまま残す。一の位の補助計算は1行あけて下に書く
        document.getElementById('cell-r0-c4').innerHTML = '<div class="box-input"></div>';

    if (state === 17 && mode === '3digit_div2') {
        // 見当(est2)でかけ算の筆算（右・1行あけて下）→ 積を おろした2けたの下に（右づめ, c4基準）→ ✗ → 立てなおしへ
        renderMultBox(est2, est2 * divisor, () => {
            showWrongXAt(4, 5);
            setTimeout(() => { state = 18; updateUI(); }, 1600);
        }, 4, 4, 4);
    }
    if (state === 18 && mode === '3digit_div2') {
        // 立てなおし：✗・大きすぎた積・一の位の補助計算だけを消す（十の位の補助計算は残す）

        renderMultBox(q2, sub2, null, 4, 4, 4);
    }
    if (state === 23 && mode === '3digit_div2') {

            document.getElementById('cell-r5-c4').innerText = rem % 10;

    if (state === 11 && mode === '2digit_div2') {

    if (state === 7 && mode !== '3digit_div2' && mode !== '3digit_div3') { // ひき算1完了
        if (mode === '2digit_div') {
            // わられる数 − 積 ＝ あまり（0でも表示、2桁なら c2,c3）
            const rem = dividend - sub1;
            if (rem >= 10) {
                document.getElementById('cell-r3-c2').innerText = Math.floor(rem / 10);
                document.getElementById('cell-r3-c3').innerText = rem % 10;
            } else {
                document.getElementById('cell-r3-c3').innerText = rem;

        } else if (mode === '3digit2') {
            const minuend = Math.floor(dividend / 10);
            const diff = minuend - sub1;
            document.getElementById('cell-r3-c4').innerText = diff > 0 ? diff : '';

        document.getElementById('cell-r3-c3').innerText = diff > 0 ? diff : '';

    }
    if (state === 8) { // おろす待機

            const numToDrop = Math.floor((dividend % 100) / 10);

            initDragDrop('drag-target-span', 'cell-r3-c5');

        const cell = document.getElementById('cell-r1-c4');

        initDragDrop('drag-target-span', 'cell-r3-c4');

    if (state === 9) { // おろす完了
        if (mode === '3digit1') {
            const numToDrop = Math.floor((dividend % 100) / 10);
            document.getElementById('cell-r1-c4').innerText = numToDrop;
            document.getElementById('cell-r3-c4').innerText = numToDrop;

            document.getElementById('cell-r1-c5').innerText = numToDrop;
            document.getElementById('cell-r3-c5').innerText = numToDrop;

        document.getElementById('cell-r1-c4').innerText = dividend % 10;
        document.getElementById('cell-r3-c4').innerText = dividend % 10;

    }
    if (state === 10) { // 2回目のたてる
        if (mode === '3digit2') {
            document.getElementById('cell-r0-c5').innerHTML = '<div class="box-input"></div>';
        } else if (mode === '2digit') {
        document.getElementById('cell-r0-c4').innerHTML = '<div class="box-input"></div>';
        }
    }
    if (state === 13 && mode !== '2digit_div3' && mode !== '3digit_div2') { // かけ算2完了
        if (mode === '3digit1') {
            const prod = sub2;
            document.getElementById('cell-r4-c3').innerText = Math.floor(prod / 10) || '';
            document.getElementById('cell-r4-c4').innerText = prod % 10;
            document.getElementById('cell-r4-c3').classList.remove('border-hidden');
            document.getElementById('cell-r4-c4').classList.remove('border-hidden');
        } else if (mode === '3digit2') {
            const prod = sub2;
            document.getElementById('cell-r4-c4').innerText = Math.floor(prod / 10) || '';
            document.getElementById('cell-r4-c5').innerText = prod % 10;
            document.getElementById('cell-r4-c4').classList.remove('border-hidden');
            document.getElementById('cell-r4-c5').classList.remove('border-hidden');
        } else {
        const prod = q2 * divisor;
        document.getElementById('cell-r4-c3').innerText = Math.floor(prod / 10) || '';
        document.getElementById('cell-r4-c4').innerText = prod % 10;
        document.getElementById('cell-r4-c3').classList.remove('border-hidden');
        document.getElementById('cell-r4-c4').classList.remove('border-hidden');
        }
    }
    if (state === 15 && mode !== '2digit_div3' && mode !== '3digit_div2') { // ひき算2完了 (クリア)
        if (mode === '3digit1') {
            const minuend1 = (parseInt(document.getElementById('cell-r3-c3').innerText) || 0) * 10 
                           + (parseInt(document.getElementById('cell-r3-c4').innerText) || 0);
            const diff = minuend1 - sub2;
            document.getElementById('cell-r5-c4').innerText = diff > 0 ? diff : '';
        } else if (mode === '3digit2') {
            document.getElementById('cell-r5-c5').innerText = '0';
            document.getElementById('instruction').innerText = answerText();
            showClearEffect();
        } else {
        document.getElementById('cell-r5-c4').innerText = '0';
        document.getElementById('instruction').innerText = answerText();
        showClearEffect();
        }
    }
    
    // 3桁①用の追加処理
    if (mode === '3digit1') {
        if (state === 16) {
            const cell = document.getElementById('cell-r1-c5');
            const numToDrop = dividend % 10;
            cell.innerHTML = `<span class="draggable-span" id="drag-target-span">${numToDrop}</span>`;
            initDragDrop('drag-target-span', 'cell-r5-c5');
        }
        if (state === 17) {
            const numToDrop = dividend % 10;

    }

    if (s.type === 'finish') {
        document.getElementById('instruction').innerText = answerText();
        if (!document.getElementById('hanamaru').classList.contains('show')) {

    }

    // --- 追加: ガイド矢印とチュートリアル処理 ---

        }
    }

}

// --- ドラッグ＆ドロップ実装 ---
function initDragDrop(spanId, targetId) {
    const span = document.getElementById(spanId);
    let isDragging = false;
    let startX, startY;
    
    span.onpointerdown = (e) => {
        if (states[state].type !== 'drag_drop') return;
        isDragging = true;
        span.setPointerCapture(e.pointerId);
        startX = e.clientX;
        startY = e.clientY;
        span.style.position = 'relative';
        span.classList.remove('hint-glow');
        playSound('click');
    };
    
    span.onpointermove = (e) => {
        if (!isDragging) return;
        const dy = e.clientY - startY;
        span.style.transform = `translate(0px, ${dy}px)`;
    };
    
    span.onpointerup = (e) => {
        if (!isDragging) return;
        isDragging = false;
        span.releasePointerCapture(e.pointerId);
        
        const targetEl = document.getElementById(targetId);
        const targetRect = targetEl.getBoundingClientRect();
        const spanRect = span.getBoundingClientRect();
        
        // 中心点距離によるスナップ判定
        const spanCX = spanRect.left + spanRect.width / 2;
        const spanCY = spanRect.top + spanRect.height / 2;
        const targetCX = targetRect.left + targetRect.width / 2;
        const targetCY = targetRect.top + targetRect.height / 2;
        
        if (Math.hypot(spanCX - targetCX, spanCY - targetCY) < 50) {
            playSound('click');
            state++;
            updateUI();
        } else {
            handleWrong(spanId);
            span.style.transition = 'transform 0.3s';
            span.style.transform = 'translate(0px, 0px)';
            setTimeout(() => { span.style.transition = ''; }, 300);
        }
    };
}

// --- 不正解・クリア演出 ---
function handleWrong(elementId, expectedAction) {
    playSound('wrong');
    const popup = document.getElementById('popup');
    popup.classList.add('show');
    setTimeout(() => popup.classList.remove('show'), 1000);
    
    // --- 追加: ヒントの光をクリア（誤タップ時に残らないように） ---
    document.querySelectorAll('.hint-glow').forEach(el => el.classList.remove('hint-glow'));
    
    // --- 追加: エラー記録とコンボリセット ---
    comboCount = 0;
    document.getElementById('combo-count').innerText = comboCount;
    const s = states[state];
    if (s) {
        // actionボタン誤押下時は、本来押すべき行為（s.expect）で分類
        if (s.type === 'action' && s.expect && errorStats[s.expect] !== undefined) {
            errorStats[s.expect]++;
        }
        // 商を立てる位置を選ぶステップ（click_cell）はたてるに分類
        else if (s.type === 'click_cell') {
            errorStats.tateru++;
        }
        // それ以外は指示文のキーワードで分類
        else if (s.text.includes("たて")) errorStats.tateru++;
        else if (s.text.includes("かけ")) errorStats.kakeru++;
        else if (s.text.includes("ひき")) errorStats.hiku++;
        else if (s.text.includes("おろ")) errorStats.orosu++;
        else errorStats.other++;
    }

    if (elementId) {
        const el = document.getElementById(elementId);
        if (el) {
            el.classList.remove('shake');
            void el.offsetWidth; // reflow
            el.classList.add('shake');
        }
    }
}

function showClearEffect() {
    document.getElementById('hanamaru').classList.add('show');
    playSound('correct');
    setTimeout(() => playSound('correct'), 300);
    
    if (typeof confetti !== 'undefined') {
        confetti({
            particleCount: 150,
            spread: 80,
            origin: { y: 0.6 },
            colors: ['#ffeb3b', '#ff9800', '#4caf50', '#00bcd4', '#e91e63']
        });
    }

    // --- 追加: タイム測定、アドバイス、コンボ ---
    const timeTaken = Math.floor((Date.now() - startTime) / 1000);
    let advice = "";
    let maxError = 0;
    let worstType = "";
    for (const [key, val] of Object.entries(errorStats)) {
        if (val > maxError) {
            maxError = val;
            worstType = key;
        }
    }
    
    if (maxError > 0) {
        if (worstType === 'tateru') advice = "「たてる」をもう少しがんばろう！";
        else if (worstType === 'kakeru') advice = "「かける」の計算に気をつけよう！";
        else if (worstType === 'hiku') advice = "「ひき算」をていねいにやろう！";
        else if (worstType === 'orosu') advice = "「おろす」場所をたしかめよう！";
        else advice = "つぎはノーミスをめざそう！";
    } else {
        advice = "かんぺき！すばらしい！";
    }

    comboCount++;
    document.getElementById('combo-count').innerText = comboCount;
    const comboSpan = document.getElementById('combo-count');
    comboSpan.style.transform = 'scale(1.5)';
    setTimeout(() => comboSpan.style.transform = 'scale(1)', 300);

    setTimeout(() => {
        // 商の見当は文が2行あるので、時間とアドバイスは出さない（マスの位置がずれるため）
        if (mode === 'kentou') {
            document.getElementById('instruction').innerHTML = answerText();
            return;
        }
        document.getElementById('instruction').innerHTML = `${answerText()}<br><span style="font-size: 1rem; color: #d32f2f;">🕒 ${timeTaken}秒！ ${advice}</span>`;
    }, 500);
}

document.querySelectorAll('.cell').forEach(cell => {
    cell.addEventListener('click', () => {
        const s = states[state];
        const cellId = cell.id.replace('cell-', '');
        
        if (s.type === 'click_cell') {
            if (cellId === s.expect) {
                playSound('click');
                state++;
                updateUI();
            } else {
                handleWrong(cell.id);
            }
        } else if (s.type === 'click_cells') {
            if (!s.expect.includes(cellId)) {
                handleWrong(cell.id);
                return;
            }
            if (!selectedCells.includes(cellId)) {
                selectedCells.push(cellId);
                cell.classList.add('selected');
                playSound('click');
            }
            if (s.expect.every(id => selectedCells.includes(id))) {
                const cur = state;
                setTimeout(() => {
                    if (state !== cur) return; // すでに次へ進んでいたら二重に進めない
                    state++;
                    updateUI();
                }, 300);
            }
        } else if (s.type === 'click_cells_group') {
            const allValid = s.expectGroups.flat();
            if (!allValid.includes(cellId)) {
                handleWrong(cell.id);
                return;
            }
            
            const targetGroup = s.expectGroups.find(group => group.includes(cellId));
            const validCells = targetGroup.filter(id => {
                const el = document.getElementById(`cell-${id}`);
                const text = el.textContent || el.innerText || '';
                return text.trim() !== '';
            });

            let isNewSelection = false;
            
            validCells.forEach(id => {
                if (!selectedCells.includes(id)) {
                    selectedCells.push(id);
                    isNewSelection = true;
                }
            });

            if (isNewSelection) {
                playSound('click');
                if (validCells.length === 1) {
                    document.getElementById(`cell-${validCells[0]}`).classList.add('selected');
                } else if (validCells.length >= 2) {
                    // 2けた・3けたどちらでも、左端→中央→右端でカプセル型の選択マークを作る
                    validCells.forEach((id, i) => {
                        const cls = i === 0 ? 'selected-group-left'
                                  : i === validCells.length - 1 ? 'selected-group-right'
                                  : 'selected-group-mid';
                        document.getElementById(`cell-${id}`).classList.add(cls);
                    });
                }
            }

            const isCorrect = s.expectGroups.every(group => {
                const groupValidCells = group.filter(id => {
                    const el = document.getElementById(`cell-${id}`);
                    const text = el.textContent || el.innerText || '';
                    return text.trim() !== '';
                });
                if (groupValidCells.length === 0) return true;
                return groupValidCells.every(id => selectedCells.includes(id));
            });

            if (isCorrect) {
                const cur = state;
                setTimeout(() => {
                    if (state !== cur) return; // すでに次へ進んでいたら二重に進めない
                    state++;
                    updateUI();
                }, 300);
            }
        }
    });
});

document.querySelectorAll('.num-btn').forEach(btn => {
    btn.addEventListener('click', () => {
        const s = states[state];
        if (mode === 'karishou') {
            // 仮の商：どの数字も「立ててみる」ことができる（正誤はかけ算で確かめる）
            if (s.type === 'input') kariTry(parseInt(btn.dataset.val, 10));
            return;
        }
        if (mode === 'ketasu') {
            const val = parseInt(btn.dataset.val, 10);
            if (ketasuFusan) {
                // 筆算ON：入れた数字で筆算を実演（✗ / はなまる）
                ketasuFusanDemo(val);
                return;
            }
            // 筆算OFF：答えの数字だけ受けつける。同じ数字は1回だけ。全部そろえば終わり
            if (s.type !== 'ketasu') return;
            const L = ketasuLay;
            if (L.answers.includes(val) && !L.entered.includes(val)) {
                playSound('click');
                L.entered.push(val);
                renderKetasuAnswers();
                if (L.entered.length === L.answers.length) {
                    state = 1;
                    showClearEffect();
                }
            } else {
                handleWrong('numpad');
            }
            return;
        }
        if (s.type === 'input') {
            const val = parseInt(btn.dataset.val, 10);
            if (val === s.expect()) {
                playSound('click');
                document.getElementById(`cell-${s.targetCell}`).innerText = val;
                // next が指定されていればそこへ（立てなおしなしの問題で修正の手順を飛ばす）
                state = (s.next !== undefined) ? s.next : state + 1;
                updateUI();
            } else if (s.altExpect && val === s.altExpect()) {
                // 別解（例：筆算2で最初から正しい商）→ 修正を飛ばして指定の状態へ
                playSound('click');
                document.getElementById(`cell-${s.targetCell}`).innerText = val;
                state = s.altNext;
                updateUI();
            } else if (Array.isArray(s.alts) && s.alts.some(a => val === a.expect())) {
                // 別解（複数）：例 筆算3で見当より小さい途中の商や、最初から正しい商
                const hit = s.alts.find(a => val === a.expect());
                playSound('click');
                document.getElementById(`cell-${s.targetCell}`).innerText = val;
                state = hit.next;
                updateUI();
            } else {
                handleWrong('numpad');
            }
        }
    });
});

[['btn-toobig', 'big'], ['btn-toosmall', 'small']].forEach(([id, val]) => {
    document.getElementById(id).addEventListener('click', () => {
        if (mode !== 'kentou') return;
        const s = states[state];
        if (!s || s.type !== 'choice') return;
        if (val === s.expect) {
            playSound('click');
            state++;
            updateUI();
        } else {
            handleWrong(id);
        }
    });
});

// --- くふうタブの「同じ数でわる／同じ数をかける」 ---
document.querySelectorAll('#kufu-level .level-btn').forEach(btn => {
    btn.addEventListener('click', () => {
        kufuLevel = btn.dataset.kufu;
        document.querySelectorAll('#kufu-level .level-btn').forEach(b => b.classList.toggle('active', b === btn));
        playSound('click');
        initGame();
    });
});

// --- 仮の商タブの難易度ボタン ---
document.querySelectorAll('#kari-level .level-btn').forEach(btn => {
    btn.addEventListener('click', () => {
        kariLevel = btn.dataset.level;
        document.querySelectorAll('#kari-level .level-btn').forEach(b => b.classList.toggle('active', b === btn));
        playSound('click');
        initGame();   // その難しさの問題を出しなおす
    });
});

// --- 仮の商タブのヒントボタン（同時に効くのは1種類だけ） ---
[['btn-kakusu', 'kakusu'], ['btn-divup', 'divup'], ['btn-bothup', 'bothup']].forEach(([id, kind]) => {
    document.getElementById(id).addEventListener('click', () => {
        if (mode !== 'karishou' || kariBusy) return;
        if (states[state].type !== 'input') return;   // ぴったり合ったあとは効かない
        playSound('click');
        setKariHint(kariHint === kind ? null : kind);   // もう一度おすと消える
    });
});

document.getElementById('btn-reset').addEventListener('click', initGame);

let currentMode = '2digit_div';
// 各筆算タブの見本問題（そのボタンを選んだときの最初の1問）
const TAB_PROBLEM = {
    '2digit_div':  [86, 43],
    '2digit_div2': [84, 23],
    '2digit_div3': [54, 15],
    '3digit_div1': [345, 46],
    '3digit_div2': [618, 28],
    '3digit_div3': [506, 123],
    'kenzan':      [78, 23],     // けん算タブを開いたときの1問目
    'kufu':        [540, 60],    // くふうタブを開いたときの1問目
    'ketasu':      [509, 52],    // 商のけた数タブを開いたときの1問目（教科書と同じ 52)5□9）
    'kentou':      [834, 21]     // 商の見当タブを開いたときの1問目（教科書と同じ）
};
const HISSAN_MODES = ['2digit_div', '2digit_div2', '2digit_div3', '3digit_div1', '3digit_div2', '3digit_div3'];
const SOON_MODES = [];   // これから作るタブ

document.querySelectorAll('.tab-btn').forEach(btn => {
    btn.addEventListener('click', () => {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        if (btn.dataset.group === 'hissan') {
            // 「筆算」タブ：いま選ばれている筆算の見本問題から始める
            const sub = document.querySelector('#hissan-sub .level-btn.active')
                     || document.querySelector('#hissan-sub .level-btn');
            currentMode = sub.dataset.mode;
            forceProblem = TAB_PROBLEM[currentMode];
        } else {
            currentMode = btn.dataset.mode;
            forceProblem = TAB_PROBLEM[currentMode] || null;
        }
        initGame();
    });
});

// 筆算の中の選択ボタン（86÷43 など）
document.querySelectorAll('#hissan-sub .level-btn').forEach(btn => {
    btn.addEventListener('click', () => {
        document.querySelectorAll('#hissan-sub .level-btn').forEach(b => b.classList.toggle('active', b === btn));
        currentMode = btn.dataset.mode;
        forceProblem = TAB_PROBLEM[currentMode];   // 最初の1問はボタンに書いてある問題
        playSound('click');
        initGame();
    });
});

// --- 初期化 ---
function initGame() {
    mode = currentMode;
    // タブの下の行：筆算のときは問題ボタン、仮の商のときは難易度ボタン
    const isHissan = HISSAN_MODES.includes(mode);
    document.getElementById('hissan-sub').style.display = isHissan ? 'flex' : 'none';
    document.getElementById('kari-level').style.display = (mode === 'karishou') ? 'flex' : 'none';
    document.getElementById('ken-level').style.display = (mode === 'kenzan') ? 'flex' : 'none';
    document.getElementById('kufu-level').style.display = (mode === 'kufu') ? 'flex' : 'none';
    // これから作るタブ
    const isSoon = SOON_MODES.includes(mode);
    document.querySelector('.main-content').style.display = isSoon ? 'none' : 'flex';
    if (isSoon) {
        document.getElementById('instruction').innerText = 'このタブはこれから作ります。';
        return;
    }
    generateProblem();
    forceProblem = null;   // 見本問題は1回だけ
    generateStates();
    state = 0;
    selectedCells = [];
    
    // --- 追加: リセット処理 ---
    startTime = Date.now();
    errorStats = { tateru: 0, kakeru: 0, hiku: 0, orosu: 0, other: 0 };
    document.querySelectorAll('.guide-arrow').forEach(el => el.remove());
    
    // UIリセット
    document.querySelectorAll('.cell').forEach(cell => {
        cell.innerText = '';
        cell.innerHTML = '';
        cell.className = 'cell';
    });
    document.getElementById('hanamaru').classList.remove('show');

    // 横式モードのときはグリッドを3列広げ、たてる〜おろすを消して「たしかめ」を出す
    const yoko = (mode === 'yokoshiki');
    const isKen = (mode === 'kenzan');
    document.querySelector('.grid').classList.toggle('yoko', yoko);   // 横式は13列
    document.querySelector('.grid').classList.toggle('ken', isKen);   // けん算は16列
    const isKufu = (mode === 'kufu');
    document.querySelector('.grid').classList.toggle('kufu', isKufu); // くふうは13列
    document.querySelector('.grid').classList.toggle('kentou', mode === 'kentou');
    kentouBusy = false;
    document.querySelector('.controls').classList.toggle('yoko-mode', yoko);
    document.querySelector('.controls').classList.toggle('ken-mode', isKen);
    document.querySelector('.controls').classList.toggle('kufu-mode', isKufu);
    document.querySelector('.controls').classList.toggle('kentou-mode', mode === 'kentou');
    document.querySelector('.controls').classList.toggle('ketasu-mode', mode === 'ketasu');
    // 商のけた数：答えの箱は筆算OFFのときだけ出す
    document.getElementById('ketasu-answer').classList.toggle('show', mode === 'ketasu' && !ketasuFusan);
    document.getElementById('ketasu-hint').classList.remove('show');
    // 商のけた数：下の青枠（0〜9の記録）は筆算ONのときだけ出す
    document.getElementById('ketasu-track').classList.toggle('show', mode === 'ketasu' && ketasuFusan);
    if (mode === 'ketasu' && ketasuFusan) renderKetasuTrack();
    // 筆算トグルの見た目（ON＝緑）
    const kfBtn = document.getElementById('btn-ketasu-fusan');
    kfBtn.innerText = '筆算：' + (ketasuFusan ? 'ON' : 'OFF');
    kfBtn.classList.toggle('on', ketasuFusan);
    ketasuBusy = false;
    // 仮の商モード：たてる〜おろすの代わりにヒントボタンを出す。上はチュートリアルでなく難易度ボタン
    document.querySelector('.controls').classList.toggle('kari-mode', mode === 'karishou');
    kariBusy = false; kariHint = null;
    document.querySelectorAll('.kari-btn').forEach(b => b.classList.remove('on'));
    
    // 罫線の初期設定（商の下線：c1, c2 の下）
    if (mode === '3digit1') {
        [3, 4, 5].forEach(c => document.getElementById(`cell-r0-c${c}`).classList.add('border-bottom'));
        [3, 4].forEach(c => {
            document.getElementById(`cell-r2-c${c}`).classList.add('border-bottom', 'border-hidden');
            document.getElementById(`cell-r4-c${c}`).classList.add('border-bottom', 'border-hidden');
        });
        [4, 5].forEach(c => document.getElementById(`cell-r6-c${c}`).classList.add('border-bottom', 'border-hidden'));
    } else if (mode === '3digit2') {
        [3, 4, 5].forEach(c => document.getElementById(`cell-r0-c${c}`).classList.add('border-bottom'));
        [3, 4].forEach(c => document.getElementById(`cell-r2-c${c}`).classList.add('border-bottom', 'border-hidden'));
        [4, 5].forEach(c => document.getElementById(`cell-r4-c${c}`).classList.add('border-bottom', 'border-hidden'));
    } else if (mode === 'karishou') {
        // 仮の商：わられる数のけた数に合わせて、上線とひき算の線を引く
        kariLay.dvCols.forEach(c => document.getElementById(`cell-r0-c${c}`).classList.add('border-bottom'));
        kariLay.targetCols.forEach(c => document.getElementById(`cell-r2-c${c}`).classList.add('border-bottom', 'border-hidden'));
    } else if (mode === '2digit_div' || mode === '2digit_div2' || mode === '2digit_div3') {
        // ２けたでわる：商の下線 r0-c2,c3／ひき算の線 r2-c2,c3
        [2, 3].forEach(c => document.getElementById(`cell-r0-c${c}`).classList.add('border-bottom'));
        [2, 3].forEach(c => document.getElementById(`cell-r2-c${c}`).classList.add('border-bottom', 'border-hidden'));
    } else if (mode === '3digit_div1') {
        // 筆算４：わられる数3けた。商の下線 r0-c2,c3,c4／ひき算の線 r2-c2,c3,c4
        [2, 3, 4].forEach(c => document.getElementById(`cell-r0-c${c}`).classList.add('border-bottom'));
        [2, 3, 4].forEach(c => document.getElementById(`cell-r2-c${c}`).classList.add('border-bottom', 'border-hidden'));
    } else if (mode === '3digit_div2') {
        // 筆算５：商2けた。商の下線(かっこの上線) r0-c2,c3,c4／ひき算1の線 r2-c2,c3／ひき算2の線 r4-c3,c4
        [2, 3, 4].forEach(c => document.getElementById(`cell-r0-c${c}`).classList.add('border-bottom'));
        [2, 3].forEach(c => document.getElementById(`cell-r2-c${c}`).classList.add('border-bottom', 'border-hidden'));
        [3, 4].forEach(c => document.getElementById(`cell-r4-c${c}`).classList.add('border-bottom', 'border-hidden'));
    } else if (mode === '3digit_div3') {
        // 筆算６：3けた÷3けた。かっこの上線 r0-c3,c4,c5／ひき算の線 r2-c3,c4,c5
        [3, 4, 5].forEach(c => document.getElementById(`cell-r0-c${c}`).classList.add('border-bottom'));
        [3, 4, 5].forEach(c => document.getElementById(`cell-r2-c${c}`).classList.add('border-bottom', 'border-hidden'));
    } else if (mode === 'kentou') {
        // 商の見当：わられる数のけた数に合わせて、かっこの上線だけ引く
        kentouLay.dvCols.forEach(c => document.getElementById(`cell-r0-c${c}`).classList.add('border-bottom'));
    } else if (mode === 'ketasu') {
        // 商のけた数：わられる数（3けた）の上に、かっこの上線だけ引く
        [2, 3, 4].forEach(c => document.getElementById(`cell-r0-c${c}`).classList.add('border-bottom'));
    } else if (mode === 'yokoshiki' || mode === 'kenzan' || mode === 'kufu') {
        // 横式・けん算・くふう：あらかじめ引く線はなし
    } else {
    [3, 4].forEach(c => document.getElementById(`cell-r0-c${c}`).classList.add('border-bottom'));
    // 積の下線（ひき算の線）：c1, c2 の下
    [3, 4].forEach(c => {
        document.getElementById(`cell-r2-c${c}`).classList.add('border-bottom', 'border-hidden');
        document.getElementById(`cell-r4-c${c}`).classList.add('border-bottom', 'border-hidden');
    });
    }

    // 「）」の位置：わられる数が始まるセルの左端に付ける
    const isYoko = (mode === 'yokoshiki');
    const kari2 = (mode === 'karishou' && dividend < 100);
    const isTwoDigitDiv = (mode === '2digit_div' || mode === '2digit_div2' || mode === '2digit_div3' || kari2);
    const is3d2dDiv = (mode === '3digit_div1' || mode === '3digit_div2' || (mode === 'karishou' && !kari2));
    const is3d3dDiv = (mode === '3digit_div3');
    if (!isYoko && mode !== 'kenzan' && mode !== 'kufu') {
        document.getElementById((isTwoDigitDiv || is3d2dDiv || mode === 'kentou' || mode === 'ketasu') ? 'cell-r1-c2' : (is3d3dDiv ? 'cell-r1-c3' : 'cell-r1-c3')).classList.add('paren-left');
    }

    // 問題のセット
    if (mode === 'kentou') {
        // かりの商を立てて、かけた積を書いたところまでを出す（ひけない状態）
        const L = kentouLay;
        document.getElementById('cell-r1-c0').innerText = Math.floor(divisor / 10);
        document.getElementById('cell-r1-c1').innerText = divisor % 10;
        String(dividend).split('').forEach((ch, i) => {
            document.getElementById(`cell-r1-c${2 + i}`).innerText = ch;
        });
        document.getElementById('cell-' + L.qCell).innerText = L.est;   // かりの商
        writeRight(2, L.onesCol, L.product);                            // 大きすぎた積
    } else if (mode === 'ketasu') {
        // わる数(2桁) c0,c1 ／ わられる数 H □ U → c2(百), c3(十=□の赤箱), c4(一)
        const L = ketasuLay;
        document.getElementById('cell-r1-c0').innerText = Math.floor(divisor / 10);
        document.getElementById('cell-r1-c1').innerText = divisor % 10;
        document.getElementById('cell-r1-c2').innerText = L.H;
        document.getElementById('cell-r1-c3').innerHTML = '<span class="ketasu-blank"></span>';
        document.getElementById('cell-r1-c4').innerText = L.U;
        document.getElementById('cell-r0-c4').innerHTML = '<span class="ketasu-qbox"></span>';  // 商を立てる一の位を青□で
        renderKetasuAnswers();
    } else if (mode === 'kufu') {
        // r1：540 ÷ 60 ／ r2-r3：やじるしと「10でわる」（右は▢）／ r4：54 ÷ ▢ ＝ ▢
        const L = kufuLay;
        const put = (row, col, ch) => { document.getElementById(`cell-r${row}-c${col}`).innerText = ch; };
        String(dividend).split('').forEach((ch, i) => put(1, L.topDvCols[i], ch));
        put(1, L.opCol, '÷');
        String(divisor).split('').forEach((ch, i) => put(1, L.topDCols[i], ch));
        // 上の数から下の数へ引く、長いやじるし（2行ぶん）
        [L.arrowL, L.arrowR].forEach(c => {
            document.getElementById(`cell-r2-c${c}`).innerHTML = '<span class="kufu-arrow"></span>';
        });
        // やじるしの横のことば。左は「10でわる」をそのまま、右は▢に入れさせる
        const label = (col, text, span) => {
            const sp = document.createElement('span');
            sp.className = 'kufu-label';
            sp.style.width = (span * 100) + '%';
            sp.innerText = text;
            document.getElementById(`cell-r3-c${col}`).appendChild(sp);
        };
        label(L.labelL, String(L.num) + L.word, 2);
        label(L.labelR, L.word, 2);
        L.inputCols.forEach(c => document.getElementById(`cell-r3-c${c}`).classList.add('kufu-op'));
        // 下の式（わられる数・÷・＝は出しておく）
        String(L.ndv).split('').forEach((ch, i) => put(4, L.botDvCols[i], ch));
        put(4, L.opCol, '÷');
        put(4, L.eqCol, '=');
    } else if (mode === 'kenzan') {
        // r1：78 ÷ 23 ＝ 3 … 9 ／ r3：23 × ▢ ＋ ▢ ＝ ▢
        const L = kenLay;
        const put = (row, col, ch) => { document.getElementById(`cell-r${row}-c${col}`).innerText = ch; };
        L.dvS.split('').forEach((ch, i) => put(1, L.l1.dv[i], ch));
        put(1, L.l1.op, '÷');
        L.dS.split('').forEach((ch, i) => put(1, L.l1.d[i], ch));
        put(1, L.l1.eq, '=');
        L.qS.split('').forEach((ch, i) => put(1, L.l1.q[i], ch));
        put(1, L.l1.dots, '…');
        document.getElementById(`cell-r1-c${L.l1.dots}`).classList.add('yoko-dots');
        L.rS.split('').forEach((ch, i) => put(1, L.l1.r[i], ch));
        // けん算の式（数を入れるところは空けておく）
        L.dS.split('').forEach((ch, i) => put(3, L.l2.d[i], ch));
        put(3, L.l2.mul, '×');
        put(3, L.l2.plus, '+');
        put(3, L.l2.eq, '=');
    } else if (isYoko) {
        // 横式：1行あけて r1、左端1マスあけて c1 から「d… ÷ v… =」を並べる（商は入力）
        const L = yokoLay;
        L.ddStr.split('').forEach((ch, i) => { document.getElementById(`cell-r1-c${L.dividendCols[i]}`).innerText = ch; });
        document.getElementById(`cell-r1-c${L.divCol}`).innerText = '÷';
        L.dvStr.split('').forEach((ch, i) => { document.getElementById(`cell-r1-c${L.divisorCols[i]}`).innerText = ch; });
        document.getElementById(`cell-r1-c${L.eqCol}`).innerText = '=';
    } else if (isTwoDigitDiv) {
        // わる数（2桁）: 十の位→c0, 一の位→c1（左端そろえ）
        document.getElementById('cell-r1-c0').innerText = Math.floor(divisor / 10);
        document.getElementById('cell-r1-c1').innerText = divisor % 10;
        // わられる数（2桁）: 十の位→c2, 一の位→c3
        document.getElementById('cell-r1-c2').innerText = Math.floor(dividend / 10);
        document.getElementById('cell-r1-c3').innerText = dividend % 10;
    } else if (is3d2dDiv) {
        // 筆算４/５：わる数（2桁）c0,c1／わられる数（3桁）c2(百),c3(十),c4(一)
        document.getElementById('cell-r1-c0').innerText = Math.floor(divisor / 10);
        document.getElementById('cell-r1-c1').innerText = divisor % 10;
        document.getElementById('cell-r1-c2').innerText = Math.floor(dividend / 100);
        document.getElementById('cell-r1-c3').innerText = Math.floor((dividend % 100) / 10);
        document.getElementById('cell-r1-c4').innerText = dividend % 10;
    } else if (is3d3dDiv) {
        // 筆算６：わる数（3桁）c0(百),c1(十),c2(一)／わられる数（3桁）c3(百),c4(十),c5(一)
        document.getElementById('cell-r1-c0').innerText = Math.floor(divisor / 100);
        document.getElementById('cell-r1-c1').innerText = Math.floor((divisor % 100) / 10);
        document.getElementById('cell-r1-c2').innerText = divisor % 10;
        document.getElementById('cell-r1-c3').innerText = Math.floor(dividend / 100);
        document.getElementById('cell-r1-c4').innerText = Math.floor((dividend % 100) / 10);
        document.getElementById('cell-r1-c5').innerText = dividend % 10;
    } else {
    document.getElementById('cell-r1-c2').innerText = divisor;
    if (mode !== '2digit') {
        document.getElementById('cell-r1-c3').innerText = Math.floor(dividend / 100);
        document.getElementById('cell-r1-c4').innerText = Math.floor((dividend % 100) / 10);
        document.getElementById('cell-r1-c5').innerText = dividend % 10;
    } else {
    document.getElementById('cell-r1-c3').innerText = Math.floor(dividend / 10);
    document.getElementById('cell-r1-c4').innerText = dividend % 10;
    }
    }

    // 仮の商タブ：赤字が出たときに数字が動かないよう、最初から少し上げた位置にしておく
    if (mode === 'karishou') {
        kariLay.divCols.concat(kariLay.dvCols).forEach(c =>
            document.getElementById(`cell-r1-c${c}`).classList.add('round-shift'));
    }

    updateUI();
}

// 起動：最初の1問も見本問題から
forceProblem = TAB_PROBLEM[currentMode] || null;
// 各行に c10〜c15 のマスを追加（横式は13列、けん算は16列のときだけ表示）
function addYokoColumns() {
    for (let r = 0; r < 8; r++) {
        let anchor = document.getElementById(`cell-r${r}-c9`);
        if (!anchor) continue;
        for (let c = 10; c <= 15; c++) {
            if (document.getElementById(`cell-r${r}-c${c}`)) continue;
            const el = document.createElement('div');
            el.className = 'cell';
            el.id = `cell-r${r}-c${c}`;
            anchor.after(el);
            anchor = el;
        }
    }
}

window.onload = () => { addYokoColumns(); initGame(); };
</script>
